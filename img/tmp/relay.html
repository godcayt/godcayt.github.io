<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>relay</title><meta name="robots" content="noindex"></head>
<body style="font-family:sans-serif;background:#111;color:#eee">
<p id="s">Preparando vídeo…</p>
<script>
(async () => {
  const s = document.getElementById('s');
  try {
    const f = new URLSearchParams(location.search).get('f');
    if (!/^[\w.-]+\.mp4$/.test(f || '')) throw new Error('nombre no válido');
    const r = await fetch(f + '?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    s.textContent = 'Enviando ' + buf.byteLength + ' bytes…';
    const target = 'https://business.facebook.com';
    (window.opener||window.parent).postMessage({ godcaRelay: true, name: f, buf }, target, [buf]);
    s.textContent = 'Enviado. Se cierra sola.';
    setTimeout(() => window.close(), 1500);
  } catch (e) {
    s.textContent = 'Error: ' + e.message;
    try { (window.opener||window.parent).postMessage({ godcaRelay: true, error: String(e) }, 'https://business.facebook.com'); } catch (_) {}
  }
})();
</script>
</body></html>
